<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM-KIM210's Blog</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 로드 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel 로드 (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* line-clamp Tailwind CSS 플러그인 기능 수동 추가 */
        @layer utilities {
            .line-clamp-2 {
                overflow: hidden;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        // React 18의 createRoot API 사용
        const { useState, useMemo } = React;

        // ============================================================================
        // 데이터 영역 (Data Section)
        // ============================================================================
        const blogPosts = [
            { id: 1, title: "나의 첫 블로그 포스트", date: "2025-10-07", category: "일기", content: "React로 블로그를 만드는 것은 정말 흥미로운 경험입니다. 앞으로 이곳에 공부한 내용과 생각들을 기록해 나갈 예정입니다. JSX, 컴포넌트, State 등 배울 것이 많지만 차근차근 나아가보려 합니다." },
            { id: 2, title: "React Hooks: useState 마스터하기", date: "2025-10-06", category: "공부", content: "useState는 함수형 컴포넌트에서 상태를 관리할 수 있게 해주는 가장 기본적인 Hook입니다. 사용법은 [상태, 상태변경함수] = useState(초기값) 형태입니다. 상태가 변경되면 컴포넌트가 리렌더링되어 화면이 업데이트됩니다." },
            { id: 3, title: "Tailwind CSS를 활용한 스타일링", date: "2025-10-05", category: "공부", content: "Tailwind CSS는 유틸리티-우선 CSS 프레임워크로, HTML을 벗어나지 않고도 빠르게 디자인을 구축할 수 있게 도와줍니다. 'w-full', 'p-4', 'text-center' 와 같은 클래스를 조합하여 스타일을 만듭니다. 모던하고 깔끔한 디자인에 아주 적합합니다." },
            { id: 4, title: "주말 산책", date: "2025-10-04", category: "일기", content: "가을 날씨가 좋아서 근처 공원으로 산책을 다녀왔다. 맑은 공기를 마시니 기분도 상쾌해졌다. 단풍이 아름답게 물들기 시작했다." },
            { id: 5, title: "JavaScript 비동기 처리: Promise와 async/await", date: "2025-10-03", category: "공부", content: "Promise는 비동기 작업의 최종 완료 또는 실패를 나타내는 객체입니다. async/await는 Promise를 더 동기적인 코드처럼 보이게 만들어 가독성을 높여주는 문법 설탕(Syntactic Sugar)입니다. API 통신과 같은 작업에 필수적입니다." },
        ];

        const calendarEvents = [
            { date: new Date(2025, 9, 10), title: "친구와 저녁 약속" },
            { date: new Date(2025, 9, 15), title: "React 프로젝트 마감" },
            { date: new Date(2025, 9, 25), title: "가족 여행" },
            { date: new Date(2025, 10, 11), title: "스터디 모임" },
        ];

        // ============================================================================
        // 컴포넌트 영역 (Components Section)
        // ============================================================================
        const Header = ({ onNavClick }) => (
            <header className="bg-white/80 backdrop-blur-md shadow-md sticky top-0 z-50">
                <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex items-center justify-between h-16">
                        <button onClick={() => onNavClick('home')} className="text-2xl font-bold text-gray-800 hover:text-blue-600 transition-colors">
                            HM-KIM210's Blog
                        </button>
                        <nav className="hidden md:flex space-x-8">
                            <button onClick={() => onNavClick('home')} className="font-medium text-gray-600 hover:text-blue-500 transition-colors">홈</button>
                            <button onClick={() => onNavClick('blog')} className="font-medium text-gray-600 hover:text-blue-500 transition-colors">블로그</button>
                            <button onClick={() => onNavClick('calendar')} className="font-medium text-gray-600 hover:text-blue-500 transition-colors">캘린더</button>
                        </nav>
                    </div>
                </div>
            </header>
        );

        const PostCard = ({ post, onPostClick }) => (
            <div onClick={() => onPostClick(post.id)} className="bg-white rounded-xl shadow-sm overflow-hidden transform hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
               <div className="p-6">
                   <span className={`inline-block px-3 py-1 text-sm font-semibold rounded-full mb-3 ${post.category === '일기' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}`}>
                       {post.category}
                   </span>
                   <h3 className="text-xl font-bold text-gray-900 mb-2 truncate">{post.title}</h3>
                   <p className="text-gray-500 text-sm mb-4">{post.date}</p>
                   <p className="text-gray-700 leading-relaxed truncate">{post.content}</p>
               </div>
            </div>
        );

        const HomePage = ({ posts, onNavClick, onPostClick }) => (
            <div className="space-y-12">
                <section className="text-center bg-white p-10 rounded-xl shadow-sm">
                    <h1 className="text-4xl md:text-5xl font-extrabold text-gray-800 mb-4 leading-tight">
                        안녕하세요! <br /> 성장을 기록하는 공간입니다.
                    </h1>
                    <p className="text-lg text-gray-600 max-w-2xl mx-auto">
                        이곳에서 일상의 생각, 배운 지식, 그리고 중요한 일정들을 공유하고 정리합니다.
                    </p>
                </section>
                
                <section>
                    <h2 className="text-3xl font-bold text-gray-800 mb-6">최신 포스트</h2>
                    <div className="grid md:grid-cols-3 gap-6">
                        {posts.slice(0, 3).map(post => <PostCard key={post.id} post={post} onPostClick={onPostClick} />)}
                    </div>
                     <div className="text-center mt-8">
                        <button onClick={() => onNavClick('blog')} className="bg-blue-500 text-white font-bold py-2 px-6 rounded-full hover:bg-blue-600 transition-colors">
                            모든 포스트 보기
                        </button>
                    </div>
                </section>
            </div>
        );
        
        const BlogPage = ({ posts, onPostClick }) => {
            const [searchTerm, setSearchTerm] = useState('');
            
            const filteredPosts = useMemo(() => 
                posts.filter(post => 
                    post.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    post.content.toLowerCase().includes(searchTerm.toLowerCase())
                ), [posts, searchTerm]);

            return (
                <div className="space-y-8">
                    <div className="flex justify-between items-center">
                        <h1 className="text-4xl font-extrabold text-gray-800">모든 포스트</h1>
                        <input
                            type="text"
                            placeholder="검색..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="px-4 py-2 border rounded-full focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        />
                    </div>
                    <div className="grid md:grid-cols-1 gap-6">
                        {filteredPosts.length > 0 ? (
                            filteredPosts.map(post => (
                                <div key={post.id} onClick={() => onPostClick(post.id)} className="bg-white rounded-xl shadow-sm p-6 flex flex-col md:flex-row items-start gap-6 transform hover:shadow-lg transition-shadow duration-300 cursor-pointer">
                                    <div className="w-full md:w-40 text-left md:text-right flex-shrink-0">
                                        <p className="text-gray-500 text-sm">{post.date}</p>
                                        <span className={`mt-2 inline-block px-3 py-1 text-sm font-semibold rounded-full ${post.category === '일기' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}`}>
                                            {post.category}
                                        </span>
                                    </div>
                                    <div className="flex-grow">
                                       <h2 className="text-2xl font-bold text-gray-900 mb-2">{post.title}</h2>
                                       <p className="text-gray-700 leading-relaxed line-clamp-2">{post.content}</p>
                                    </div>
                                </div>
                            ))
                        ) : (
                            <p className="text-center text-gray-500 py-10">검색 결과가 없습니다.</p>
                        )}
                    </div>
                </div>
            );
        };

        const PostDetailPage = ({ post, onBackClick }) => (
            <div className="bg-white rounded-xl shadow-sm p-8 md:p-12">
                <button onClick={onBackClick} className="mb-8 text-blue-500 hover:text-blue-700 font-semibold">&larr; 목록으로 돌아가기</button>
                <span className={`inline-block px-3 py-1 text-sm font-semibold rounded-full mb-4 ${post.category === '일기' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}`}>
                    {post.category}
                </span>
                <h1 className="text-4xl font-extrabold text-gray-900 mb-3">{post.title}</h1>
                <p className="text-gray-500 mb-8">{post.date}</p>
                <div className="prose max-w-none text-gray-800 leading-loose">
                    {post.content.split('\n').map((paragraph, index) => <p key={index}>{paragraph}</p>)}
                </div>
            </div>
        );

        const CalendarPage = ({ events }) => {
            const [currentDate, setCurrentDate] = useState(new Date(2025, 9, 1)); // 2025년 10월로 고정
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
            const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));
            
            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const days = ["일", "월", "화", "수", "목", "금", "토"];

            const calendarDays = [];
            for (let i = 0; i < firstDayOfMonth; i++) calendarDays.push(<div key={`empty-${i}`} className="border rounded-lg p-2"></div>);

            for (let day = 1; day <= daysInMonth; day++) {
                const today = new Date(year, month, day);
                const isCurrentDay = today.toDateString() === new Date().toDateString();
                const dayEvents = events.filter(e => e.date.toDateString() === today.toDateString());
                
                calendarDays.push(
                    <div key={day} className={`border rounded-lg p-2 h-28 flex flex-col ${isCurrentDay ? 'bg-blue-50' : 'bg-white'}`}>
                        <span className={`font-bold ${isCurrentDay ? 'text-blue-600' : 'text-gray-800'}`}>{day}</span>
                        <div className="mt-1 space-y-1 overflow-y-auto text-xs">
                             {dayEvents.map((event, i) => <div key={i} className="bg-green-200 text-green-800 p-1 rounded truncate">{event.title}</div>)}
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <h1 className="text-4xl font-extrabold text-gray-800 mb-6">캘린더</h1>
                    <div className="bg-white p-6 rounded-xl shadow-sm">
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={handlePrevMonth} className="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md font-bold">&lt;</button>
                            <h2 className="text-2xl font-bold text-gray-800">{`${year}년 ${month + 1}월`}</h2>
                            <button onClick={handleNextMonth} className="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md font-bold">&gt;</button>
                        </div>
                        <div className="grid grid-cols-7 gap-2">
                            {days.map(d => <div key={d} className="font-bold text-center text-gray-600 py-2">{d}</div>)}
                            {calendarDays}
                        </div>
                    </div>
                </div>
            );
        };
        
        const Footer = () => (
            <footer className="bg-white mt-12">
                <div className="max-w-5xl mx-auto py-6 px-4 sm:px-6 lg:px-8 text-center text-gray-500">
                    <p>&copy; {new Date().getFullYear()} HM-KIM210. All Rights Reserved.</p>
                    <p className="mt-1">
                        <a href="https://github.com/HM-KIM210" target="_blank" rel="noopener noreferrer" className="hover:text-blue-500 transition-colors">GitHub Profile</a>
                    </p>
                </div>
            </footer>
        );

        function App() {
            const [page, setPage] = useState('home');
            const [selectedPostId, setSelectedPostId] = useState(null);

            const handleNavClick = (targetPage) => {
                setPage(targetPage);
                setSelectedPostId(null);
            };

            const handlePostClick = (postId) => {
                setSelectedPostId(postId);
            };

            const handleBackClick = () => {
                setSelectedPostId(null);
                setPage('blog');
            };
            
            const renderContent = () => {
                if (selectedPostId) {
                    const post = blogPosts.find(p => p.id === selectedPostId);
                    return <PostDetailPage post={post} onBackClick={handleBackClick} />;
                }

                switch (page) {
                    case 'blog':
                        return <BlogPage posts={blogPosts} onPostClick={handlePostClick} />;
                    case 'calendar':
                        return <CalendarPage events={calendarEvents} />;
                    case 'home':
                    default:
                        return <HomePage posts={blogPosts} onNavClick={handleNavClick} onPostClick={handlePostClick} />;
                }
            };

            return (
                <div className="min-h-screen font-sans">
                    <Header onNavClick={handleNavClick} />
                    <main className="max-w-5xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
                        {renderContent()}
                    </main>
                    <Footer />
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
